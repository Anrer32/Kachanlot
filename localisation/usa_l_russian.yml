USA_war_bonds:0 "Военные облигации США"
USA_war_bonds_desc:0 "Выпуск военных облигаций позволит привлечь средства гражданского населения для срочного финансирования нашей оборонной промышленности."
USA_expand_war_prod:0 "Расширение военного производства"
USA_expand_war_prod_desc:0 "Нам необходимо ускорить перевод гражданских заводов на военные рельсы и значительно увеличить объёмы выпускаемого снаряжения."

USA_tot_economic:0 "Тотальная экономика"
USA_tot_economic_desc:0 "Вся экономическая система государства должна быть полностью подчинена нуждам фронта. Все ресурсы — на войну."

USA_final_mob:0 "Финальная мобилизация"
USA_final_mob_desc:0 "Последний решительный шаг по мобилизации оставшихся людских и промышленных резервов ради достижения безоговорочной победы."

USA_tank_prod_expand:0 "Расширение производства танков"
USA_tank_prod_expand_desc:0 "Модернизация существующих сборочных линий и постройка новых цехов для массового выпуска бронетехники."

USA_tank_prod_expand_1:0 "Дальнейшее расширение производства танков"
USA_tank_prod_expand_1_desc:0 "Внедрение передовых стандартов тяжёлого машиностроения, чтобы обеспечить нашим войскам абсолютное превосходство на земле."

USA_aircraft_expansion:0 "Расширение авиастроения"
USA_aircraft_expansion_desc:0 "Масштабное расширение авиационных заводов и подготовка инфраструктуры, чтобы наши ВВС полностью контролировали небо."
war_bonds:0 "Военные облигации"
 war_bonds_desc:0 "Выпуск военных облигаций позволил привлечь финансовые средства граждан для поддержки оборонного сектора, что снизило спрос на гражданские товары и подстегнуло военное производство."

 arms_production_expand:0 "Расширение военного производства"
 arms_production_expand_desc:0 "Программа по развёртыванию новых промышленных мощностей, увеличению темпов строительства военных заводов и эффективному освоению местных ресурсов."

 mass_arms_production_expand:0 "Массовое расширение производства"
 mass_arms_production_expand_desc:0 "Тотальная мобилизация промышленности. Максимальное расширение доступных строительных площадок, форсированное возведение заводов и верфей, а также вывод эффективности производства на предел."

 tank_production_expand:0 "Развитие танковой промышленности"
 tank_production_expand_desc:0 "Оптимизация сборочных линий и стандартизация узлов бронетехники позволили значительно снизить затраты на производство танков."

 air_production_expand:0 "Развитие авиастроения"
 air_production_expand_desc:0 "Внедрение конвейерного метода сборки фюзеляжей и оптимизация цепочек поставок снизили производственную стоимость всех типов самолётов."