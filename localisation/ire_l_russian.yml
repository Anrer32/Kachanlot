l_russian:
IRE_economic_wounds:0 "Последствия англо-ирландской торговой войны"
IRE_economic_wounds_desc:0 "Экономическое противостояние с Великобританией оставило глубокие шрамы. Политика экономической самодостаточности требует времени, а экспорт сельскохозяйственной продукции всё ещё не оправился от недавнего кризиса."
IRE_limited_manpower:0 "Ограниченный людской резерв"
IRE_limited_manpower_desc:0 "Небольшое население и высокий уровень эмиграции не позволяют Ирландии содержать крупную армию. Государство вынуждено полагаться на профессиональную подготовку и качество войск."
IRE_ulster_question:0 "Незажившая рана Ольстера"
IRE_ulster_question_desc:0 "Раздел острова остаётся предметом ожесточённых политических споров. Вопрос Северной Ирландии объединяет националистов, но одновременно вызывает серьёзные разногласия внутри общества."
IRE_catholic_influence:0 "Влияние Католической Церкви"
IRE_catholic_influence_desc:0 "Католическая церковь остаётся одной из важнейших общественных сил страны, поддерживая стабильность и национальное единство, но препятствуя быстрым социальным изменениям."