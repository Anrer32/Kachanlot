germany.1044.t:0 "Роковой полет над Растенбургом"
germany.1044.d:0 "8 февраля 1942 года самолет Heinkel He 111, на борту которого находился рейхсминистр вооружения Фриц Тодт, рухнул сразу после взлета из ставки «Волчье логово». Накануне Тодт вел тяжелый разговор с фюрером, утверждая, что война на истощение против СССР экономически проиграна. Официальное следствие заявляет о случайном подрыве механизма самоликвидации, но в коридорах власти шепчутся о спланированном устранении пессимистичного министра. Нам нужно срочно найти замену главе военной машины."
GER_mio_trait_stug:0 "Stug"
