 EQ_MOD_CAT_ship_deck_space_small_TITLE: "Малая палуба ангара"
 ship_deck_space_small: "Малая палуба ангара"
 kmp_ship_hull_escort_carrier: "Эскортный авианосец"
 kmp_ship_hull_escort_carrier_desc: "Подводные лодки серьезно угрожали торговому флоту во время войны. Хотя самолеты лучше справлялись с охотой на подводные лодки, они не могли обеспечить защиту конвоев на межконтинентальных маршрутах из-за ограниченного запаса топлива. Стратегическая ценность обычных авианосцев также делает их ограниченными в фронтовых боях. Эскортный авианосец рассматривается как решение. С небольшими ангарами он очень дешев для некоторых используемых гражданских компонентов."