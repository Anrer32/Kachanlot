l_russian:
 IRE_KLN_idea_economic_war:0 "Англо-ирландская экономическая война"
 IRE_KLN_idea_economic_war_desc:0 "Экономическое противостояние с Великобританией продолжается. Торговые ограничения затрудняют развитие экономики и снабжение страны."
 IRE_KLN_idea_underfunded_defence:0 "Недостаточное финансирование обороны"
 IRE_KLN_idea_underfunded_defence_desc:0 "Ограниченное финансирование сдерживает подготовку и организацию вооружённых сил."
 IRE_KLN_idea_agrarian_economy:0 "Аграрная экономика"
 IRE_KLN_idea_agrarian_economy_desc:0 "Сельское хозяйство занимает важное место в экономике. Промышленная база остаётся ограниченной."
 IRE_KLN_idea_civil_war_legacy:0 "Наследие гражданской войны"
 IRE_KLN_idea_civil_war_legacy_desc:0 "Разногласия, оставленные гражданской войной, продолжают влиять на общественную и политическую жизнь."
 IRE_KLN_idea_incomplete_sovereignty:0 "Незавершённый суверенитет"
 IRE_KLN_idea_incomplete_sovereignty_desc:0 "Ирландское Свободное государство самостоятельно, но формальные связи с Британским Содружеством и нерешённые конституционные вопросы требуют политических усилий."
 IRE_KLN_idea_state_industrial_policy:0 "Государственный индустриальный курс"
 IRE_KLN_idea_state_industrial_policy_desc:0 "Правительство поддерживает развитие национальной промышленности, стремясь сократить экономическую зависимость страны."
